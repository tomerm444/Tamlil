<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#128C7E">
<title>תמלול</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root { --green:#128C7E; --bg:#f0f2f5; --card:#fff; --text:#111b21; --muted:#667781; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--green); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
  header h1 { font-size:20px; margin:0; }
  header button { background:none; border:0; color:#fff; font-size:22px; padding:4px 8px; }
  main { padding:16px; max-width:640px; margin:auto; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .transcript { font-size:20px; line-height:1.6; white-space:pre-wrap; }
  .meta { color:var(--muted); font-size:13px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; }
  .btn { background:var(--green); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-size:16px; }
  .btn.light { background:#e7f3f1; color:var(--green); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:10px; font-size:16px; border:1px solid #ccd; border-radius:8px; direction:ltr; }
  .spinner { width:42px; height:42px; border:4px solid #d9e9e6; border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; margin:10px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .center { text-align:center; }
  .err { color:#b00020; }
  .hidden { display:none !important; }
  .muted { color:var(--muted); font-size:14px; line-height:1.5; }
  h2 { font-size:16px; color:var(--muted); margin:20px 4px 8px; }
  a { color:var(--green); }
  .titlebar { display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:15px; color:var(--green); }
  .titlebar b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon { background:none; border:0; font-size:16px; padding:2px 6px; opacity:.7; }
</style>
</head>
<body>
<header>
  <h1>🎙️ תמלול</h1>
  <button id="settingsBtn" aria-label="הגדרות">⚙️</button>
</header>
<main>
  <section id="settings" class="card hidden">
    <b>הגדרות</b>
    <label for="key">מפתח Gemini API</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza...">
    <p class="muted">מקבלים מפתח בחינם ב-<a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>. המפתח נשמר רק בטלפון הזה.</p>
    <label for="model">מודל</label>
    <input id="model" type="text" placeholder="auto">
    <p class="muted">auto = בחירה אוטומטית של המודל החדש ביותר. אין צורך לשנות.</p>
    <div class="row" style="margin-top:12px">
      <button class="btn" id="saveBtn">שמירה</button>
      <button class="btn light" id="closeBtn">סגירה</button>
    </div>
  </section>

  <section id="status" class="card center hidden"></section>

  <section id="current" class="card hidden">
    <div class="titlebar"><b id="currentTitle"></b><button class="icon" id="renameCurrent" aria-label="שינוי שם">✏️</button></div>
    <div class="transcript" id="currentText"></div>
    <div class="meta">
      <span id="currentTime"></span>
      <div class="row"><button class="btn light" id="copyBtn">העתקה</button><button class="btn light" id="delCurrent" aria-label="מחיקה">🗑</button></div>
    </div>
    <div class="muted" id="currentInfo" style="direction:ltr;font-size:11px;margin-top:6px"></div>
  </section>

  <section id="welcome" class="card hidden">
    <p class="muted">
      איך משתמשים: בוואטסאפ לוחצים לחיצה ארוכה על הודעה קולית ← שיתוף (<b>לא</b> "העבר") ← "תמלול". התמליל יופיע כאן.
    </p>
    <div class="row">
      <label class="btn light" style="margin:0;font-weight:normal">
        בחירת קובץ שמע ידנית
        <input type="file" id="filePick" accept="audio/*,.opus,.ogg,.m4a" class="hidden">
      </label>
    </div>
  </section>

  <div id="histTitle" class="hidden" style="display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px">
    <h2 style="margin:0">תמלולים קודמים</h2>
    <button class="btn light" id="clearAll" style="padding:6px 12px;font-size:14px">מחיקת הכל</button>
  </div>
  <div id="history"></div>
</main>

<script>
const DEFAULT_MODEL = 'auto';   // auto = pick the newest available Flash model from the API's model list
const OLD_DEFAULTS = ['gemini-flash-latest', 'gemini-2.5-flash', ''];
const SYSTEM = 'אתה מתמלל הודעות קוליות מוואטסאפ. אתה כותב בדיוק את מה שנאמר, בשפה שבה נאמר. ' +
  'ההודעות כמעט תמיד בעברית, ואז התמליל חייב להיות כתוב באותיות עבריות. לעולם אל תתרגם לאנגלית.';
const PROMPT = 'תמלל את ההודעה הקולית המצורפת מילה במילה, בעברית (או בשפה שבה הדובר באמת מדבר). ' +
  'אסור לתרגם ואסור לסכם. הוסף פיסוק וחלוקה לפסקאות כדי שיהיה נוח לקרוא. ' +
  'החזר רק את התמליל עצמו, בלי הקדמה ובלי הערות. גם אם ההקלטה שקטה או לא ברורה, תמלל כל מה שאפשר לשמוע. ' +
  'רק אם אין בהקלטה דיבור בכלל, החזר בדיוק: [לא זוהה דיבור]';
const RETRY_PROMPT = 'התמליל הקודם שלך יצא באנגלית, כנראה בטעות תרגמת. האזן שוב להקלטה. ' +
  'אם הדובר מדבר עברית, כתוב את מה שהוא אומר מילה במילה באותיות עבריות. ' +
  'רק אם הדובר באמת מדבר אנגלית, החזר את התמליל באנגלית. החזר רק את התמליל.';

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ---------- settings ----------
function openSettings() {
  $('key').value = store.get('apiKey', '');
  $('model').value = store.get('model', DEFAULT_MODEL);
  $('settings').classList.remove('hidden');
}
$('settingsBtn').onclick = () => {
  if ($('settings').classList.contains('hidden')) openSettings();
  else $('settings').classList.add('hidden');
};
$('closeBtn').onclick = () => $('settings').classList.add('hidden');
$('saveBtn').onclick = () => {
  store.set('apiKey', $('key').value.trim());
  store.set('model', $('model').value.trim() || DEFAULT_MODEL);
  store.set('modelList', '');
  $('settings').classList.add('hidden');
  if (pendingFile) { const f = pendingFile; pendingFile = null; transcribe(f); }
};

// ---------- history ----------
function loadHistory() { try { return JSON.parse(store.get('history', '[]')); } catch { return []; } }
function saveHistory(h) { store.set('history', JSON.stringify(h.slice(0, 15))); }
function fmt(ts) { return new Date(ts).toLocaleString('he-IL', { dateStyle:'short', timeStyle:'short' }); }
function renderHistory(skipFirst) {
  const h = loadHistory().slice(skipFirst ? 1 : 0);
  $('history').innerHTML = '';
  $('histTitle').classList.toggle('hidden', !h.length);
  for (const item of h) {
    const c = document.createElement('div'); c.className = 'card';
    const tb = document.createElement('div'); tb.className = 'titlebar';
    const tt = document.createElement('b'); tt.textContent = titleOf(item);
    const e = document.createElement('button'); e.className = 'icon'; e.textContent = '✏️'; e.setAttribute('aria-label', 'שינוי שם');
    e.onclick = () => { if (renameItem(item)) tt.textContent = titleOf(item); };
    tb.append(tt, e); c.append(tb);
    const t = document.createElement('div'); t.className = 'transcript'; t.style.fontSize = '17px'; t.textContent = item.text;
    const m = document.createElement('div'); m.className = 'meta';
    const s = document.createElement('span'); s.textContent = fmt(item.ts);
    const b = document.createElement('button'); b.className = 'btn light'; b.textContent = 'העתקה';
    b.onclick = () => copy(item.text, b);
    const d = document.createElement('button'); d.className = 'btn light'; d.textContent = '🗑'; d.setAttribute('aria-label', 'מחיקה');
    d.onclick = () => { deleteItem(item.ts); renderHistory(!$('current').classList.contains('hidden')); };
    const g = document.createElement('div'); g.className = 'row'; g.append(b, d);
    m.append(s, g); c.append(t, m); $('history').append(c);
  }
}
function titleOf(item) { return item.title || 'הודעה קולית'; }
function renameItem(item) {
  const name = prompt('שם לתמלול:', item.title || '');
  if (name === null) return false;
  item.title = name.trim();
  saveHistory(loadHistory().map(x => x.ts === item.ts ? { ...x, title: item.title } : x));
  return true;
}
function deleteItem(ts) { saveHistory(loadHistory().filter(x => x.ts !== ts)); }
$('clearAll').onclick = () => {
  if (!confirm('למחוק את כל התמלולים?')) return;
  saveHistory([]); $('current').classList.add('hidden'); renderHistory(false);
};
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'הועתק ✓'; setTimeout(() => btn.textContent = 'העתקה', 1500); } catch {}
}

// ---------- transcription ----------
let pendingFile = null;

function status(html) { $('status').innerHTML = html; $('status').classList.remove('hidden'); }
function hideStatus() { $('status').classList.add('hidden'); }

function guessMime(blob, name) {
  let t = (blob.type || '').split(';')[0].trim();
  if (t && t !== 'application/octet-stream') return t === 'audio/opus' ? 'audio/ogg' : t;
  const ext = (name || '').split('.').pop().toLowerCase();
  return { opus:'audio/ogg', ogg:'audio/ogg', m4a:'audio/mp4', mp4:'audio/mp4', mp3:'audio/mp3', aac:'audio/aac', wav:'audio/wav', amr:'audio/amr' }[ext] || 'audio/ogg';
}
function toBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function callGemini(model, key, mime, data, prompt = PROMPT, useThinking = true) {
  const gen = {};
  if (/gemini-3/.test(model)) { if (useThinking) gen.thinkingConfig = { thinkingLevel: 'low' }; }  // faster
  else gen.temperature = 0;
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM }] },
      contents: [{ parts: [{ inline_data: { mime_type: mime, data } }, { text: prompt }] }],
      generationConfig: gen
    })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 400 && useThinking && gen.thinkingConfig && /think/i.test(j.error?.message || ''))
      return callGemini(model, key, mime, data, prompt, false);
    const e = new Error(j.error?.message || ('HTTP ' + r.status)); e.status = r.status; throw e;
  }
  const text = (j.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if (!text) throw new Error('התקבלה תשובה ריקה');
  return text;
}
const hasHebrew = s => /[\u0590-\u05FF]/.test(s);

// Ask the API which models this key can use, so retired model names don't break the app.
async function candidateModels(key, chosen) {
  const manual = chosen && chosen !== 'auto' ? [chosen] : [];
  let list = [];
  try {
    const cached = JSON.parse(store.get('modelList', 'null'));
    if (cached && Date.now() - cached.ts < 86400000) list = cached.list;
  } catch {}
  if (!list.length) {
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
      const j = await r.json();
      const ver = n => parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/) || [])[1] || 0);
      const ok = (j.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace(/^models\//, ''))
        .filter(n => /^gemini-\d/.test(n) && /(flash|pro)/.test(n) &&
                     !/(lite|image|tts|live|audio|embed|exp|computer|robotics|thinking|learnlm|customtools)/i.test(n));
      const flash = ok.filter(n => n.includes('flash')).sort((a, b) => ver(b) - ver(a));
      const pro   = ok.filter(n => n.includes('pro')).sort((a, b) => ver(b) - ver(a));
      list = [...flash.slice(0, 3), 'gemini-flash-latest', ...pro.slice(0, 2)];
      if (ok.length) store.set('modelList', JSON.stringify({ ts: Date.now(), list }));
    } catch {}
  }
  if (!list.length) list = ['gemini-flash-latest', 'gemini-pro-latest'];
  return [...new Set([...manual, ...list])];
}

async function transcribe(file) {
  $('current').classList.add('hidden');
  const key = store.get('apiKey', '');
  if (!key) {
    pendingFile = file;
    status('צריך להגדיר מפתח API פעם אחת, ואז התמלול יתחיל.');
    openSettings();
    return;
  }
  status('<div class="spinner"></div>מתמלל...');
  try {
    const mime = guessMime(file, file.name);
    if (file.size < 500) throw Object.assign(new Error(`file size ${file.size} bytes`), { status: -1 });
    const data = await toBase64(file);
    let chosen = store.get('model', DEFAULT_MODEL);
    if (OLD_DEFAULTS.includes(chosen)) { chosen = DEFAULT_MODEL; store.set('model', chosen); }
    const models = await candidateModels(key, chosen);
    const isKeyError = e => e.status === 401 || e.status === 403 || (e.status === 400 && /api key/i.test(e.message));
    const busy = s => s === 429 || s >= 500;
    let text, lastErr, usedModel;
    outer:
    for (const model of models) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          status(`<div class="spinner"></div>מתמלל...<div class="muted" style="direction:ltr">${model}</div>`);
          text = await callGemini(model, key, mime, data); usedModel = model;
          if (!hasHebrew(text) && /[a-z]{3}/i.test(text)) {          // came back in English → ask again in Hebrew
            status(`<div class="spinner"></div>מוודא שהתמליל בעברית...`);
            try { text = await callGemini(model, key, mime, data, RETRY_PROMPT); } catch {}
          }
          break outer;
        }
        catch (e) {
          lastErr = e;
          if (isKeyError(e)) throw e;
          if (!busy(e.status) || attempt === 1) break;   // unavailable model or still busy → next model
          status('<div class="spinner"></div>השרת עמוס, מנסה שוב...');
          await new Promise(r => setTimeout(r, 2500));
        }
      }
    }
    if (!text) throw lastErr;
    hideStatus();
    const item = { text, ts: Date.now(), info: `${usedModel} · ${file.name} · ${mime} (${file.type || 'no type'}) · ${Math.round(file.size/1024)}KB` };
    const h = loadHistory(); h.unshift(item); saveHistory(h);
    showCurrent(item);
  } catch (e) {
    pendingFile = file;
    const friendly =
      (e.status === 400 && /api key/i.test(e.message)) || e.status === 401 || e.status === 403 ? 'בעיה במפתח ה-API. בדקו אותו בהגדרות (⚙️).' :
      e.status === 429 ? 'הגעתם למכסת השימוש החינמית לעכשיו. נסו שוב בעוד כמה דקות.' :
      e.status >= 500 ? 'השרתים של גוגל עמוסים כרגע. נסו שוב בעוד דקה.' :
      e.status === -1 ? 'הקובץ שהתקבל מוואטסאפ ריק. נסו לשתף שוב.' :
      !e.status ? 'אין חיבור לאינטרנט, או שהבקשה נכשלה.' : 'התמלול נכשל.';
    status(`<div class="err">${friendly}</div><div class="muted" style="direction:ltr;margin-top:6px">${String(e.message).replace(/</g,'&lt;')}</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="retryBtn">נסה שוב</button></div>`);
    $('retryBtn').onclick = () => { const f = pendingFile; pendingFile = null; transcribe(f); };
  }
}
function showCurrent(item) {
  $('currentText').textContent = item.text;
  $('currentTitle').textContent = titleOf(item);
  $('renameCurrent').onclick = () => { if (renameItem(item)) $('currentTitle').textContent = titleOf(item); };
  $('currentTime').textContent = fmt(item.ts);
  $('currentInfo').textContent = item.info || '';
  $('current').classList.remove('hidden');
  $('copyBtn').onclick = () => copy(item.text, $('copyBtn'));
  $('delCurrent').onclick = () => { deleteItem(item.ts); $('current').classList.add('hidden'); renderHistory(false); };
  renderHistory(true);
}

$('filePick').onchange = e => { const f = e.target.files[0]; if (f) transcribe(f); e.target.value = ''; };

// ---------- startup ----------
(async () => {
  $('welcome').classList.remove('hidden');
  renderHistory(false);
  if (new URLSearchParams(location.search).get('shared')) {
    history.replaceState(null, '', './');
    const cache = await caches.open('shared');
    const resp = await cache.match('shared-audio');
    if (resp) {
      await cache.delete('shared-audio');
      const blob = await resp.blob();
      const name = decodeURIComponent(resp.headers.get('X-File-Name') || 'audio');
      const file = new File([blob], name, { type: resp.headers.get('Content-Type') || blob.type });
      transcribe(file);
    } else {
      status('<div class="err">לא התקבל קובץ שמע. נסו לשתף שוב.</div>');
    }
  } else if (!store.get('apiKey', '')) {
    openSettings();
  }
})();
</script>
</body>
</html>
